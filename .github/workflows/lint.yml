---
name: Lint

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - uses: actionshub/markdownlint@main
        with:
          path: ./content

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - run: npm install
      - run: npx stylelint "assets/css/input.css"
